name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: sudo apt-get update && sudo apt-get install -y nsis zip
      - run: ./scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HomeLibrary-Windows
          path: |
            dist/windows/HomeLibrary-Setup-*.exe
            dist/windows/*.zip
          if-no-files-found: error
