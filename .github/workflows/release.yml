name: Release

# Push a tag such as v1.0.1 (it must match "version" in package.json). The workflow builds the
# macOS and Windows installers and creates a DRAFT release; review it, then click Publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            name: mac
            build: npx electron-builder --mac --arm64 --x64 --publish never
          - os: windows-latest
            name: win
            build: npx electron-builder --win nsis --x64 --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Tag must match package.json version
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm test
        if: matrix.name == 'mac'
      - run: ${{ matrix.build }}
        env:
          # Unsigned until Apple / Windows signing certificates are added as repository secrets.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/electron/*.dmg
            dist/electron/*.zip
            dist/electron/*.exe
            dist/electron/*.blockmap
            dist/electron/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Checksums
        run: cd release && sha256sum *.dmg *.zip *.exe > SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" release/* --draft --generate-notes --title "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
